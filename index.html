    <script>
      // Immediately purge stale/poisoned service worker caches on development hosts or legacy SW versions
      (function() {
        if (typeof window === 'undefined') return;
        var isDevHost = location.hostname.includes('run.app') || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if ('serviceWorker' in navigator && isDevHost) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              if (name.includes('v1') || isDevHost) {
                caches.delete(name);
              }
            });
          });
        }
      })();
    </script>
